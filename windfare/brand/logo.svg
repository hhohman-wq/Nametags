<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Windfare gust mark">
  <rect width="64" height="64" rx="16" fill="#0E6E7E"/>
  <!-- three gust strokes accelerating up-right -->
  <path d="M9 45 Q24 46 36 39" fill="none" stroke="#F2F6F7" stroke-width="5" stroke-linecap="round"/>
  <path d="M12 35 Q25 34 35 29" fill="none" stroke="#F2F6F7" stroke-width="5" stroke-linecap="round" opacity="0.82"/>
  <path d="M17 25 Q27 23 34 20" fill="none" stroke="#F2F6F7" stroke-width="5" stroke-linecap="round" opacity="0.64"/>
  <!-- climbing delta: the fare taking off -->
  <path d="M39 34 L56 12 L51 36 L44 31 Z" fill="#F2F6F7"/>
</svg>
